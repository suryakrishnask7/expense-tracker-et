# Woodpecker CI Pipeline Configuration for Expense Tracker ET
# Academic Project: "Design and Implementation of a CI/CD Pipeline Using Woodpecker CI"

when:
  - event: [push, pull_request]
    branch: [main]

steps:
  # Stage 1: Automated Testing & Validation
  - name: test
    image: python:3.12-slim
    environment:
      FLASK_ENV: testing
      TESTING: true
      PYTHONPATH: .
    commands:
      - python -V
      - pip install --no-cache-dir --upgrade pip
      - pip install --no-cache-dir -r requirements.txt
      - pip install --no-cache-dir -r requirements-dev.txt
      - python -m pytest -v --cov=app

  - name: deploy
    image: alpine:3.19
    depends_on:
      - test
    when:
      - event: push
        branch: main
    environment:
      DEPLOY_SSH_KEY:
        from_secret: deploy_ssh_key
      DEPLOY_HOST:
        from_secret: deploy_host
      DEPLOY_USER:
        from_secret: deploy_user
      DEPLOY_PATH:
        from_secret: deploy_path
      DEPLOY_PORT:
        from_secret: deploy_port
    commands:
      - apk add --no-cache openssh-client rsync bash
      - sh deploy/ci_deploy.sh

